[package]
name = "fu"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy =  {version = "0.18", features = ["debug"] }
avian3d = "0.6"
tungstenite = "0.24"
# Already in the tree via tungstenite; used directly to parse the HTTP request
# head so the listener can route plain HTTP alongside the WebSocket endpoint.
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bevy exposes no clipboard API, so the join screen's "Paste" button reads the
# system clipboard through arboard (the same crate egui uses).
arboard = "3"

# Faster iterative builds: compile dependencies with optimizations,
# keep our own crate cheap to recompile. This is Bevy's recommended dev profile.
[profile.dev]
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 3
